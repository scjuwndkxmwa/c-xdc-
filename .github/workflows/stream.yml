name: Run 6-Hour Stream via Docker

on:
  workflow_dispatch: # للتشغيل اليدوي متى شئت
  schedule:
    - cron: '0 */5 * * *' # للتشغيل تلقائياً كل 5 ساعات

jobs:
  run-docker-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # تحديد مدة التشغيل بـ 6 ساعات كاملة لحسابات Pro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tiktok-to-youtube .

      - name: Run Docker Container
        run: docker run --rm tiktok-to-youtube
